<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Registration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-form { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px; display: block; width: 300px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 Frontend Registration Test</h1>
    
    <div class="test-form">
        <h2>Test Registration</h2>
        <input type="text" id="name" placeholder="Full Name" value="Test User">
        <input type="email" id="email" placeholder="Email" value="">
        <input type="password" id="password" placeholder="Password" value="TestPassword123">
        <button onclick="testRegistration()">Test Registration</button>
        <div id="reg-result"></div>
    </div>

    <div class="test-form">
        <h2>Test Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password" value="TestPassword123">
        <button onclick="testLogin()">Test Login</button>
        <div id="login-result"></div>
    </div>

    <script>
        // Generate unique email for testing
        document.getElementById('email').value = 'test_' + Date.now() + '@example.com';
        
        async function testRegistration() {
            const resultDiv = document.getElementById('reg-result');
            resultDiv.innerHTML = 'Testing registration...';
            
            const data = {
                action: 'register',
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            try {
                const response = await fetch('src/api/auth/userApi.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '✅ Registration successful!';
                    
                    // Update login form
                    document.getElementById('login-email').value = data.email;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = '❌ Registration failed: ' + result.message;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Error: ' + error.message;
            }
        }
        
        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = 'Testing login...';
            
            const data = {
                action: 'login',
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };
            
            try {
                const response = await fetch('src/api/auth/userApi.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '✅ Login successful! Token: ' + (result.token ? 'Generated' : 'Missing');
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = '❌ Login failed: ' + result.message;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '❌ Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
