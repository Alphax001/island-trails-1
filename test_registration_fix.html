<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 10px; width: 100%; max-width: 300px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>🧪 Registration Fix Test</h1>
    <p>Testing the fixed registration with proper field mapping.</p>

    <form id="test-form">
        <div class="form-group">
            <label for="first_name">First Name:</label>
            <input type="text" id="first_name" name="first_name" value="John" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last Name:</label>
            <input type="text" id="last_name" name="last_name" value="Doe" required>
        </div>
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="johndoe" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" value="TestPassword123" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" value="TestPassword123" required>
        </div>
        <button type="submit">Test Registration</button>
    </form>

    <div id="result"></div>

    <script>
        // Generate unique email
        document.getElementById('email').value = 'test_fix_' + Date.now() + '@example.com';

        document.getElementById('test-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div style="padding: 10px; background: #e2e3e5;">Testing registration...</div>';
            
            try {
                const formData = new FormData(e.target);
                
                // Use the same logic as the fixed frontend
                const registerData = {
                    name: `${formData.get('first_name')} ${formData.get('last_name')}`.trim(),
                    email: formData.get('email'),
                    password: formData.get('password')
                };

                console.log('📤 Sending registration data:', registerData);

                const response = await fetch('src/api/auth/userApi.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ action: 'register', ...registerData })
                });

                const responseText = await response.text();
                console.log('📥 Raw response:', responseText);

                const data = JSON.parse(responseText);
                console.log('📥 Parsed response:', data);

                if (data.status === 'success') {
                    resultDiv.innerHTML = `<div class="result success">
                        ✅ Registration Successful!<br>
                        Name: ${registerData.name}<br>
                        Email: ${registerData.email}<br>
                        Message: ${data.message}
                    </div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">
                        ❌ Registration Failed!<br>
                        Message: ${data.message}
                    </div>`;
                }

            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `<div class="result error">❌ Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
